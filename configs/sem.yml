# The single active SEM training recipe. Experiment-varying values are
# deliberately repeated by the canonical ddimctl command and may be overridden
# only through typed command-line options.
data:
  dataset: SEM
  image_size: 32
  channels: 1
  logit_transform: false
  uniform_dequantization: false
  gaussian_dequantization: false
  random_flip: false
  rescaled: true
  num_workers: 0
  cache_in_memory: false
  recursive: false
  validation_split: 0.1
  split_seed: 2019
  extensions: [".png", ".tif", ".tiff", ".jpg", ".jpeg"]

model:
  type: simple
  in_channels: 1
  out_ch: 1
  ch: 64
  ch_mult: [1, 2, 2, 2]
  num_res_blocks: 2
  attn_resolutions: [16]
  dropout: 0.0
  var_type: fixedlarge
  ema_rate: 0.999
  ema: true
  resamp_with_conv: true

diffusion:
  beta_schedule: linear
  beta_start: 0.001
  beta_end: 0.2
  num_diffusion_timesteps: 100

training:
  batch_size: 7
  max_steps: 20000
  checkpoint_every: 2500
  checkpoint_minutes: 30
  validation_every: 2500
  sample_every: 2500

sampling:
  batch_size: 8

optim:
  optimizer: Adam
  lr: 0.0002
  weight_decay: 0.0
  beta1: 0.9
  amsgrad: false
  eps: 0.00000001
  grad_clip: 1.0
